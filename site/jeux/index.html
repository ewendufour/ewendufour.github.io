<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeux · Ewen DUFOUR</title>
  <meta name="description" content="Petits jeux à faire dans le navigateur.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <!-- Applique le mode néon avant l'affichage, pour éviter un flash. -->
  <script>(function(){var r=document.documentElement,q=null,t=null,p=null,ok=/^(violet|vert|orange|bleu|rouge)$/;try{q=new URLSearchParams(location.search);t=q.get("theme");p=q.get("palette")}catch(e){}if(!ok.test(p||""))p=null;try{if(t==="neon")localStorage.setItem("theme","neon");else if(t==="normal")localStorage.removeItem("theme");else t=localStorage.getItem("theme");if(p)localStorage.setItem("palette",p);else p=localStorage.getItem("palette")}catch(e){}if(t==="neon")r.dataset.theme="neon";if(ok.test(p||""))r.dataset.palette=p})()</script>
  <link rel="stylesheet" href="../style.css?v=dev">
  <script src="../theme.js?v=dev" defer></script>
</head>
<body>

  <header class="entete-page">
    <h1>Jeux</h1>
    <p>Quelques petits jeux, ajoutés au fur et à mesure.</p>
  </header>

  <nav>
    <a href="../index.html">Accueil</a>
    <div class="reglages">
      <a class="langue" href="../en/games/index.html" hreflang="en" data-pos="gauche" aria-label="English version">
        <span>FR</span><span lang="en">EN</span>
      </a>
      <button class="neon-btn" type="button" aria-pressed="false"><svg class="icone" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0l1.8 6.2L16 8l-6.2 1.8L8 16l-1.8-6.2L0 8l6.2-1.8z" fill="currentColor"/></svg> Néon</button>
      <select class="palette" aria-label="Couleurs du mode néon">
        <option value="violet">Violet</option>
        <option value="vert">Vert</option>
        <option value="orange">Orange</option>
        <option value="bleu">Bleu</option>
        <option value="rouge">Rouge</option>
      </select>
    </div>
  </nav>

  <main>

    <section>
      <!-- Une ligne <li> par jeu ; penser à la version anglaise (en/games/). -->
      <ul class="liste-jeux">
        <li>
          <a href="morpion/index.html">
            <strong>Morpion</strong>
            <span>Contre l'ordinateur, en trois niveaux de difficulté.</span>
          </a>
        </li>
      </ul>
    </section>

  </main>

  <footer>
    <p>© 2026 Ewen DUFOUR</p>
  </footer>

</body>
</html>
