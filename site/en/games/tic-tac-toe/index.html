<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-tac-toe · Ewen DUFOUR</title>
  <meta name="description" content="Tic-tac-toe against the computer, with three difficulty levels.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <!-- Applies neon mode before first paint to avoid a flash. -->
  <script>(function(){var r=document.documentElement,q=null,t=null,p=null,ok=/^(violet|vert|orange|bleu|rouge)$/;try{q=new URLSearchParams(location.search);t=q.get("theme");p=q.get("palette")}catch(e){}if(!ok.test(p||""))p=null;try{if(t==="neon")localStorage.setItem("theme","neon");else if(t==="normal")localStorage.removeItem("theme");else t=localStorage.getItem("theme");if(p)localStorage.setItem("palette",p);else p=localStorage.getItem("palette")}catch(e){}if(t==="neon")r.dataset.theme="neon";if(ok.test(p||""))r.dataset.palette=p})()</script>
  <link rel="stylesheet" href="../../../style.css?v=dev">
  <script src="../../../theme.js?v=dev" defer></script>
  <script src="../../../jeux/morpion/morpion.js?v=dev" defer></script>
</head>
<body>

  <header class="entete-page">
    <h1>Tic-tac-toe</h1>
    <p>Line up three Xs before the computer does. The first player changes every game.</p>
  </header>

  <nav>
    <a href="../../index.html">Home</a>
    <a href="../index.html">Games</a>
    <div class="reglages">
      <a class="langue" href="../../../jeux/morpion/index.html" hreflang="fr" data-pos="droite" aria-label="Version française">
        <span lang="fr">FR</span><span>EN</span>
      </a>
      <button class="neon-btn" type="button" aria-pressed="false"><svg class="icone" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0l1.8 6.2L16 8l-6.2 1.8L8 16l-1.8-6.2L0 8l6.2-1.8z" fill="currentColor"/></svg> Neon</button>
      <select class="palette" aria-label="Neon colours">
        <option value="violet">Purple</option>
        <option value="vert">Green</option>
        <option value="orange">Orange</option>
        <option value="bleu">Blue</option>
        <option value="rouge">Red</option>
      </select>
    </div>
  </nav>

  <main>

    <section class="morpion">
      <fieldset class="niveaux">
        <legend>Difficulty</legend>
        <label><input type="radio" name="niveau" value="faible"><span>Easy</span></label>
        <label><input type="radio" name="niveau" value="moyen"><span>Medium</span></label>
        <label><input type="radio" name="niveau" value="fort"><span>Hard</span></label>
      </fieldset>

      <p class="morpion-statut" role="status"></p>
      <div class="grille" role="group" aria-label="Tic-tac-toe board"></div>
      <noscript><p>This game needs JavaScript.</p></noscript>

      <button class="bouton morpion-nouvelle" type="button">New game</button>

      <dl class="score">
        <div><dt>Wins</dt><dd data-score="victoires">0</dd></div>
        <div><dt>Draws</dt><dd data-score="nuls">0</dd></div>
        <div><dt>Losses</dt><dd data-score="defaites">0</dd></div>
      </dl>
    </section>

  </main>

  <footer>
    <p>© 2026 Ewen DUFOUR</p>
  </footer>

</body>
</html>
